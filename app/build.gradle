apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'org.jetbrains.kotlinx.kover'

android {
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    defaultConfig {
        applicationId "com.app.dailylog"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 3102
        versionName "3.1.2"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "placeholder.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: ""
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        debug {
            // Lets a debug build install next to the release app instead of conflicting with it
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            if (System.getenv("KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding = true
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            // Robolectric needs merged resources to inflate layouts in JVM tests
            includeAndroidResources = true
            all {
                // Robolectric's Android 16 runtime needs this on JDK 21
                jvmArgs '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
            }
        }
    }
    namespace 'com.app.dailylog'

    // F-Droid Requirement
    // Disables dependency metadata when building APKs and Android App Bundles
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    api 'com.google.android.material:material:1.12.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    implementation 'com.opencsv:opencsv:5.7.1'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Room
    implementation 'androidx.room:room-runtime:2.7.0'
    implementation "androidx.room:room-ktx:2.7.0"
    androidTestImplementation "androidx.room:room-testing:2.7.0"
    ksp "androidx.room:room-compiler:2.7.0"

    // Lifecycle components
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"

    // Test
    testImplementation('junit:junit:4.13.2')
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core-ktx:1.6.1'
    testImplementation 'androidx.test.ext:junit-ktx:1.2.1'
    testImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    // Kept at the versions matching espresso-core 3.5.1 below; mixing 1.6.x with it breaks
    // ActivityScenario.recreate() on emulators
    androidTestImplementation 'androidx.test:core-ktx:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.1.5'
    androidTestImplementation 'org.mockito:mockito-android:5.14.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

kover {
    reports {
        filters {
            excludes {
                classes(
                    "com.app.dailylog.databinding.*",
                    "com.app.dailylog.repository.ShortcutDao_Impl*",
                    "com.app.dailylog.repository.ShortcutDatabase_Impl*",
                    "com.app.dailylog.ui.settings.ShortcutTouchHelper*",
                    "com.app.dailylog.ui.settings.ShortcutTouchViewHolder*",
                    "com.app.dailylog.ui.permissions.PermissionChecker*",
                )
            }
        }
        verify {
            rule {
                bound {
                    minValue = 45 // Fails build if line coverage is < 45%
                }
            }
        }
    }
}