name: Kover Coverage Report

on:
  pull_request:
    branches: [ "main" ] # Adjust to your default branch

jobs:
  kover-report:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Required to post comments

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 1. Run Kover Tasks
      # koverHtmlReport generates the HTML for manual inspection if needed
      # koverVerify checks coverage against your defined rules
      # koverXmlReport is often needed by the reporting action
      - name: Run Kover Report & Verify
        run: ./gradlew koverXmlReport

      # 2. Post Results as PR Comment
      - name: Post Kover Report
        uses: mi-kas/kover-report@5f58465b6f395c8fa3adc2665e27250bad87de50 # v1
        with:
          # Path to the generated XML report(s)
          path: |
            ${{ github.workspace }}/app/build/reports/kover/report.xml
          title: "Code Coverage Report"
          update-comment: true # Updates existing comment on new pushes
          min-coverage-overall: 40
          min-coverage-changed-files: 80
